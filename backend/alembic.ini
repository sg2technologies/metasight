[alembic]
script_location = app/migrations
# Community's own versions/ plus, when present, the Enterprise package's
# migration branch (../enterprise/, a sibling top-level directory — see
# app/main.py's metasight_enterprise plugin hook for the same Community/
# Enterprise seam applied to routes instead of migrations). A Community-only
# checkout that has no ../enterprise/ directory just sees the one path below
# resolve to nothing extra; `alembic upgrade head` still works off the single
# Community head. With both present, use `alembic upgrade heads` (plural) —
# see DEPLOYMENT.md.
version_locations = %(here)s/app/migrations/versions ../enterprise/metasight_enterprise/migrations/versions
version_path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
