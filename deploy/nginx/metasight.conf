# MetaSight — nginx reverse proxy + static frontend
#
# Serves the built React SPA (frontend/dist) and reverse-proxies API routes to
# the gunicorn/uvicorn workers bound on 127.0.0.1:8000 (see
# deploy/systemd/metasight-api.service). Install to
# /etc/nginx/sites-available/metasight, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`.
#
# Replace metasight.example.com and the TLS cert paths before use.

upstream metasight_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── Plain-HTTP: redirect to HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name metasight.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metasight.example.com;

    # certbot --nginx will fill these in; shown here for clarity if setting up
    # TLS manually instead.
    ssl_certificate     /etc/letsencrypt/live/metasight.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metasight.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m;  # screenshot/evidence uploads from PAM agents

    root /opt/metasight/frontend/dist;
    index index.html;

    # ── API routes → gunicorn/uvicorn ──────────────────────────────────────
    # Mirrors the top-level router prefixes registered in backend/app/main.py.
    # If you add a new top-level router prefix, add it here too.
    location ~ ^/(auth|users|sources|scans|tables|connectors|policies|catalog|query|audit|approvals|settings|security|pam|superadmin|downloads|health)(/|$) {
        proxy_pass http://metasight_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── SPA — React Router client-side routes ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache (Vite fingerprints filenames on build)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
