# MetaSight — full local dev stack (Postgres, Redis, Vault, backend,
# celery worker, frontend).
#
# Quick start: cp .env.example .env, fill in real secrets, then
#   docker compose up -d --build
# Frontend: http://localhost:3000   Backend/API: http://localhost:8000
#
# This is the local/dev path, not a hardened production deploy — for
# bare-metal/VM production (systemd, gunicorn, nginx/TLS, hardening
# checklist), see DEPLOYMENT.md; it doesn't use this file.
#
# Stop:  docker compose down
# Logs:  docker compose logs -f

services:

  # ── PostgreSQL (MetaSight's own metadata store) ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: metasight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-metadata_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metadata_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: metasight-redis
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── HashiCorp Vault (dev mode) ──────────────────────────────────────────────
  # Auto-unsealed, KV v2 enabled at secret/, root token from VAULT_TOKEN (.env).
  # Data is in-memory — lost on container restart. Optional: MetaSight falls
  # back to its own AES-256-GCM encrypted_config storage if VAULT_ADDR is
  # unset, but this compose file always points the backend at this Vault —
  # remove VAULT_ADDR from the backend service below if you'd rather not run
  # it at all.
  vault:
    image: hashicorp/vault:1.17
    container_name: metasight-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: warn
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-root} -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: metasight-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUN_MIGRATIONS: "true"        # only this service runs `alembic upgrade head` — see docker-entrypoint.sh
      # uvicorn --reload's file watcher (watchfiles) misses changes to this
      # bind-mounted source tree on Windows/WSL2 — OS-level file-change
      # events don't reliably cross the bind-mount boundary. Polling is
      # slower (checks every ~0.3s instead of reacting to an OS event) but
      # actually works everywhere.
      WATCHFILES_FORCE_POLLING: "true"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-metadata_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_BROKER_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — see .env.example}
      SETUP_SECRET: ${SETUP_SECRET:?Set SETUP_SECRET in .env — see .env.example}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env — see .env.example}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env — see .env.example}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env — see .env.example}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENV: development
      AGENT_CALLBACK_URL: http://localhost:8000
      # Shared secret between this service and the `gateway` service below —
      # gates GET /gateway/backend-credentials (returns real DB passwords),
      # must never be reachable from anywhere but the gateway container. Dev
      # default only; set a real generated secret for any real deployment.
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-dev_gateway_internal_key_change_me}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      # Lets a Data Source pointed at "host.docker.internal" reach a database
      # running on your machine but outside this compose stack (e.g. a local
      # Postgres install). "localhost" from inside this container means the
      # container itself, not your host — use host.docker.internal instead.
      - "host.docker.internal:host-gateway"

  # ── MetaSight Gateway (transparent PostgreSQL wire-protocol proxy) ──────────
  gateway:
    build:
      context: ./backend/gateway
    container_name: metasight-gateway
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "6543"
      GATEWAY_API_BASE_URL: http://backend:8000
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-dev_gateway_internal_key_change_me}
      # TLS is mandatory — docker-entrypoint.sh generates a self-signed dev
      # cert on first start if these paths don't already exist (they won't,
      # on a fresh volume). Not for production use — see DEPLOYMENT.md.
      GATEWAY_TLS_CERT: /app/certs/gateway.crt
      GATEWAY_TLS_KEY: /app/certs/gateway.key
      # MySQL listener is opt-in and off by default here — it's new and not
      # yet verified against a real MySQL client (see DEPLOYMENT.md). Set
      # this and uncomment the 3306 port mapping below to try it.
      # GATEWAY_MYSQL_PORT: "3306"
    ports:
      - "6543:6543"
      # - "3306:3306"   # only if GATEWAY_MYSQL_PORT is set above
    volumes:
      - gateway_certs:/app/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Celery worker (async scan jobs) ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
    container_name: metasight-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-metadata_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_BROKER_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — see .env.example}
      SETUP_SECRET: ${SETUP_SECRET:?Set SETUP_SECRET in .env — see .env.example}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env — see .env.example}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env — see .env.example}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env — see .env.example}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      ENV: development
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]

  # ── Frontend (Vite dev server, HMR) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: metasight-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # don't let the bind mount above shadow the container's own install

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local
  gateway_certs:
    driver: local
