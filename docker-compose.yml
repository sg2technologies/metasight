# MetaSight — Infrastructure Services
# Starts Redis (Celery broker) and HashiCorp Vault (credential store).
# PostgreSQL and application services are managed separately.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f

services:

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: metasight-redis
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── HashiCorp Vault (dev mode) ──────────────────────────────────────────────
  # Auto-unsealed, KV v2 enabled at secret/, root token = "root"
  # Data is in-memory — lost on container restart (fine for local dev/testing)
  #
  # After starting, enable in backend/.env:
  #   VAULT_ADDR=http://localhost:8200
  #   VAULT_TOKEN=root
  vault:
    image: hashicorp/vault:1.17
    container_name: metasight-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: warn
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  redis_data:
    driver: local
