<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <!-- Blue-to-purple gradient for iris lines -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <!-- Blue gradient for the M badge -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Outer eye stroke gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Outer eye shape ── -->
  <!-- Top arc -->
  <path d="M 20 80 Q 50 30 100 26 Q 150 30 180 80" stroke="url(#eyeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Bottom arc -->
  <path d="M 20 80 Q 50 130 100 134 Q 150 130 180 80" stroke="url(#eyeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ── Inner iris lines (concentric arcs) ── -->
  <path d="M 38 80 Q 60 48 100 44 Q 140 48 162 80" stroke="url(#irisGrad)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 38 80 Q 60 112 100 116 Q 140 112 162 80" stroke="url(#irisGrad)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 52 80 Q 68 56 100 54 Q 132 56 148 80" stroke="url(#irisGrad)" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 52 80 Q 68 104 100 106 Q 132 104 148 80" stroke="url(#irisGrad)" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- ── Circuit lines with endpoint dots ── -->
  <!-- Left side circuits -->
  <line x1="38" y1="80" x2="14" y2="62" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
  <circle cx="14" cy="62" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <line x1="32" y1="72" x2="8" y2="72" stroke="#818CF8" stroke-width="1" opacity="0.6"/>
  <circle cx="8" cy="72" r="2" fill="#818CF8" opacity="0.9"/>
  <line x1="36" y1="90" x2="12" y2="96" stroke="#A855F7" stroke-width="1" opacity="0.6"/>
  <circle cx="12" cy="96" r="2" fill="#A855F7" opacity="0.9"/>
  <line x1="38" y1="80" x2="18" y2="52" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <circle cx="18" cy="52" r="1.5" fill="#60A5FA" opacity="0.8"/>

  <!-- Right side circuits -->
  <line x1="162" y1="80" x2="186" y2="62" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
  <circle cx="186" cy="62" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <line x1="168" y1="72" x2="192" y2="72" stroke="#818CF8" stroke-width="1" opacity="0.6"/>
  <circle cx="192" cy="72" r="2" fill="#818CF8" opacity="0.9"/>
  <line x1="164" y1="90" x2="188" y2="96" stroke="#A855F7" stroke-width="1" opacity="0.6"/>
  <circle cx="188" cy="96" r="2" fill="#A855F7" opacity="0.9"/>
  <line x1="162" y1="80" x2="182" y2="52" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <circle cx="182" cy="52" r="1.5" fill="#60A5FA" opacity="0.8"/>

  <!-- ── Inner dark circle (pupil/iris background) ── -->
  <circle cx="100" cy="80" r="30" fill="#0B1120"/>
  <circle cx="100" cy="80" r="30" stroke="url(#irisGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- ── M mark (shield-chevron style) ── -->
  <!-- Outer M shape with notch at bottom -->
  <path d="
    M 83 67
    L 83 90
    L 88 90
    L 88 76
    L 100 86
    L 112 76
    L 112 90
    L 117 90
    L 117 67
    L 100 79
    Z
  " fill="url(#mGrad)" filter="url(#glow)"/>
  <!-- Small shield notch at bottom center -->
  <path d="M 95 90 L 100 96 L 105 90 Z" fill="url(#mGrad)" opacity="0.9"/>
</svg>
